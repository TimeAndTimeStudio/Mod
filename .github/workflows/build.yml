name: Build

# Builds the mod for Minecraft 26.2 and 26.3 and uploads the jars as artifacts.
on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        mc: [ 26.2, 26.3 ]
        include:
          - mc: 26.2
            fabric_api: 0.161.0+26.2
          - mc: 26.3
            fabric_api: 0.165.2+26.3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Build for Minecraft ${{ matrix.mc }}
        run: ./gradlew build -Pminecraft_version=${{ matrix.mc }} -Pfabric_api_version=${{ matrix.fabric_api }} --no-daemon

      - name: Upload artifact (Minecraft ${{ matrix.mc }})
        uses: actions/upload-artifact@v4
        with:
          name: timesmp-mc${{ matrix.mc }}
          path: build/libs/*.jar
