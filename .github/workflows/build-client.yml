name: Build Client

on:
  push:
    branches: [ client ]
  pull_request:
    branches: [ client ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        mc: [ 26.2, 26.3 ]
        include:
          - mc: 26.2
            fabric_api: 0.161.0+26.2
          - mc: 26.3
            fabric_api: 0.165.2+26.3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Build for Minecraft ${{ matrix.mc }}
        run: ./gradlew build -Pminecraft_version=${{ matrix.mc }} -Pfabric_api_version=${{ matrix.fabric_api }} --no-daemon

      - name: Upload artifact (Minecraft ${{ matrix.mc }})
        uses: actions/upload-artifact@v4
        with:
          name: timesmp-client-mc${{ matrix.mc }}
          path: build/libs/*.jar

  release:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download built jars
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p dist
          cp artifacts/timesmp-client-mc26.3/timesmp-client.jar dist/timesmp-client-mc26.3.jar
          cp artifacts/timesmp-client-mc26.2/timesmp-client.jar dist/timesmp-client-mc26.2.jar
          ls -lh dist

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="client-latest"
          NOTES="Automated build of timesmp-client (${GITHUB_SHA::7}) on $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "TimeSMP Client Latest" --notes "$NOTES"
          else
            gh release create "$TAG" --title "TimeSMP Client Latest" --notes "$NOTES"
          fi
          gh release upload "$TAG" dist/timesmp-client-mc26.3.jar dist/timesmp-client-mc26.2.jar --clobber
          echo "Published: $(gh release view "$TAG" --json url --jq .url)"
